apiVersion: v1
kind: ConfigMap
metadata:
  name: carenest-dev-config
  namespace: carenest-dev
data:
  NODE_ENV: development
  LOG_LEVEL: debug
  KAFKA_BROKERS: kafka:9092
  REDIS_URL: redis://redis:6379
  IOT_GATEWAY_HOST: "0.0.0.0"
  IOT_GATEWAY_PORT: "18800"
  IOT_MAX_BUFFER_SIZE: "4096"
---
apiVersion: v1
kind: Secret
metadata:
  name: carenest-dev-secrets
  namespace: carenest-dev
type: Opaque
stringData:
  DATABASE_URL: postgres://carenest:carenest_dev@postgres:5432/carenest
  JWT_SECRET: replace-me-with-a-32-byte-random-string
  MEILISEARCH_MASTER_KEY: carenest_dev_master_key

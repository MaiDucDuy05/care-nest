# Prometheus scrape config for the CareNest dev stack.
# Each NestJS service exposes GET /metrics (added in S18 via
# @carenest/nestjs-common's MetricsModule). The targets use the
# docker-compose service names, which resolve on the compose network.
global:
  scrape_interval: 30s
  scrape_timeout: 10s
  external_labels:
    env: dev

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: carenest-services
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          service: 'api-gateway'
      - targets: ['host.docker.internal:3001']
        labels:
          service: 'auth-service'
      - targets: ['host.docker.internal:3002']
        labels:
          service: 'catalog-service'
      - targets: ['host.docker.internal:3003']
        labels:
          service: 'device-service'
      - targets: ['host.docker.internal:3004']
        labels:
          service: 'order-service'
      - targets: ['host.docker.internal:3005']
        labels:
          service: 'payment-service'
      - targets: ['host.docker.internal:3006']
        labels:
          service: 'notification-service'
      - targets: ['host.docker.internal:3007']
        labels:
          service: 'alert-service'
      - targets: ['host.docker.internal:3008']
        labels:
          service: 'subscription-service'
      - targets: ['host.docker.internal:3009']
        labels:
          service: 'shipping-service'

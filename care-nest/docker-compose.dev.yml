# Local development stack — Postgres+TimescaleDB, Kafka, Redis, MeiliSearch
# Usage: `docker compose -f docker-compose.dev.yml up -d`

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: carenest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: carenest
      POSTGRES_PASSWORD: carenest_dev
      POSTGRES_DB: carenest
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carenest -d carenest"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: carenest-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  kafka:
    image: bitnami/kafka:3.7
    container_name: carenest-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      # KRaft mode (no Zookeeper)
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka_data:/bitnami/kafka

  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: carenest-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: carenest_dev_master_key
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data

  # IoT device simulator (desktop) joins the local TCP gateway on this port
  # The gateway itself runs in dev via `pnpm --filter iot-gateway dev`
  iot-gateway:
    profiles: ["full"] # only enabled with `docker compose --profile full up`
    build:
      context: .
      dockerfile: infrastructure/docker/iot-gateway.Dockerfile
    container_name: carenest-iot-gateway
    restart: unless-stopped
    environment:
      NODE_ENV: development
      IOT_GATEWAY_PORT: 18800
    ports:
      - "18800:18800"
    depends_on:
      kafka:
        condition: service_started

  auth-service:
    profiles: ["full"]
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.service
      args:
        SERVICE: auth-service
    container_name: carenest-auth-service
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://carenest:carenest_dev@postgres:5432/carenest?schema=public
      JWT_SECRET: care-nest-jwt-secret-dev-2026
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  catalog-service:
    profiles: ["full"]
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.service
      args:
        SERVICE: catalog-service
    container_name: carenest-catalog-service
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3002
      DATABASE_URL: postgresql://carenest:carenest_dev@postgres:5432/carenest?schema=public
      REDIS_URL: redis://redis:6379
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  device-service:
    profiles: ["full"]
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.service
      args:
        SERVICE: device-service
    container_name: carenest-device-service
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3003
      DATABASE_URL: postgresql://carenest:carenest_dev@postgres:5432/carenest?schema=public
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379
    ports:
      - "3003:3003"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  meili_data:

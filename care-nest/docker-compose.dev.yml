# Local development stack — Postgres+TimescaleDB, Kafka, Redis, MeiliSearch
# Usage: `docker compose -f docker-compose.dev.yml up -d`

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: carenest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: carenest
      POSTGRES_PASSWORD: carenest_dev
      POSTGRES_DB: carenest
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carenest -d carenest"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: carenest-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  kafka:
    image: apache/kafka:3.9.0
    container_name: carenest-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      # KRaft mode (no Zookeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data

  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: carenest-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: carenest_dev_master_key
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data

  # IoT device simulator (desktop) joins the local TCP gateway on this port
  # The gateway itself runs in dev via `pnpm --filter iot-gateway dev`
  iot-gateway:
    profiles: ["full"] # only enabled with `docker compose --profile full up`
    build:
      context: .
      dockerfile: infrastructure/docker/iot-gateway.Dockerfile
    container_name: carenest-iot-gateway
    restart: unless-stopped
    environment:
      NODE_ENV: development
      IOT_GATEWAY_PORT: 18800
    ports:
      - "18800:18800"
    depends_on:
      kafka:
        condition: service_started

  api-gateway:
    profiles: ["full"]
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.service
      args:
        SERVICE: api-gateway
    container_name: carenest-api-gateway
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 8080
      AUTH_SERVICE_URL: http://auth-service:3001
      CATALOG_SERVICE_URL: http://catalog-service:3002
      DEVICE_SERVICE_URL: http://device-service:3003
      ORDER_SERVICE_URL: http://order-service:3004
      PAYMENT_SERVICE_URL: http://payment-service:3005
      NOTIFICATION_SERVICE_URL: http://notification-service:3006
      ALERT_SERVICE_URL: http://alert-service:3007
      SUBSCRIPTION_SERVICE_URL: http://subscription-service:3008
      SHIPPING_SERVICE_URL: http://shipping-service:3009
    ports:
      - "8080:8080"

  auth-service:
    profiles: ["full"]
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.service
      args:
        SERVICE: auth-service
    container_name: carenest-auth-service
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://carenest:carenest_dev@postgres:5432/carenest?schema=public
      JWT_SECRET: care-nest-jwt-secret-dev-2026
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  catalog-service:
    profiles: ["full"]
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.service
      args:
        SERVICE: catalog-service
    container_name: carenest-catalog-service
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3002
      DATABASE_URL: postgresql://carenest:carenest_dev@postgres:5432/carenest?schema=public
      REDIS_URL: redis://redis:6379
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  device-service:
    profiles: ["full"]
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.service
      args:
        SERVICE: device-service
    container_name: carenest-device-service
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3003
      DATABASE_URL: postgresql://carenest:carenest_dev@postgres:5432/carenest?schema=public
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379
    ports:
      - "3003:3003"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  order-service:
    profiles: ["full"]
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.service
      args:
        SERVICE: order-service
    container_name: carenest-order-service
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3004
      DATABASE_URL: postgresql://carenest:carenest_dev@postgres:5432/carenest?schema=public
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379
    ports:
      - "3004:3004"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  payment-service:
    profiles: ["full"]
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.service
      args:
        SERVICE: payment-service
    container_name: carenest-payment-service
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3005
      DATABASE_URL: postgresql://carenest:carenest_dev@postgres:5432/carenest?schema=public
      REDIS_URL: redis://redis:6379
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-DEMO_VNP}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-DEMO_VNP_SECRET}
      MOMO_PARTNER_CODE: ${MOMO_PARTNER_CODE:-DEMO_MOMO}
      MOMO_ACCESS_KEY: ${MOMO_ACCESS_KEY:-DEMO_MOMO_KEY}
      MOMO_SECRET_KEY: ${MOMO_SECRET_KEY:-DEMO_MOMO_SECRET}
    ports:
      - "3005:3005"
    depends_on:
      postgres:
        condition: service_healthy

  notification-service:
    profiles: ["full"]
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.service
      args:
        SERVICE: notification-service
    container_name: carenest-notification-service
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3006
      DATABASE_URL: postgresql://carenest:carenest_dev@postgres:5432/carenest?schema=public
      KAFKA_BROKERS: kafka:9092
    ports:
      - "3006:3006"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  alert-service:
    profiles: ["full"]
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.service
      args:
        SERVICE: alert-service
    container_name: carenest-alert-service
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3007
      DATABASE_URL: postgresql://carenest:carenest_dev@postgres:5432/carenest?schema=public
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379
    ports:
      - "3007:3007"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  subscription-service:
    profiles: ["full"]
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.service
      args:
        SERVICE: subscription-service
    container_name: carenest-subscription-service
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3008
      DATABASE_URL: postgresql://carenest:carenest_dev@postgres:5432/carenest?schema=public
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379
      ACTIVATION_SECRET: ${ACTIVATION_SECRET:-dev-activation-secret-32bytes-xxxxxx}
      ACTIVATION_TOKEN_TTL_DAYS: 30
      CRON_ENABLED: "true"
    ports:
      - "3008:3008"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  shipping-service:
    profiles: ["full"]
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.service
      args:
        SERVICE: shipping-service
    container_name: carenest-shipping-service
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3009
      DATABASE_URL: postgresql://carenest:carenest_dev@postgres:5432/carenest?schema=public
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379
      GHN_TOKEN: ${GHN_TOKEN:-}
      GHN_SHOP_ID: ${GHN_SHOP_ID:-}
      GHTK_TOKEN: ${GHTK_TOKEN:-}
      DEFAULT_PROVIDER: GHN
    ports:
      - "3009:3009"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  # ----------------------------------------------------------------
  # S18 — Observability stack (Prometheus + Grafana)
  # ----------------------------------------------------------------
  prometheus:
    profiles: ["full", "monitoring"]
    image: prom/prometheus:v2.55.0
    container_name: carenest-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    profiles: ["full", "monitoring"]
    image: grafana/grafana:11.3.0
    container_name: carenest-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3100:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  meili_data:
  prometheus_data:
  grafana_data:
